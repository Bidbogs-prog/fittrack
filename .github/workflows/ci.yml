# Quality gate (docs/qa/test-strategy.md §6): every push and pull request
# runs static analysis, the automated test suite and a production build.
# The paid, live-model coach safety eval runs on demand only (eval.yml).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build never talks to Supabase or the AI provider.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static analysis — lint
        run: npm run lint
      - name: Static analysis — type check
        run: npx tsc --noEmit -p .
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  system:
    # Playwright system tests: public pages, security headers, accessibility
    # (axe), against a production build with the AI provider mocked.
    # Signed-in specs run only when E2E_* secrets point at a TEST project.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: System tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
