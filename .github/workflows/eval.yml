# Coach red-team / grounding eval against the live model (docs/qa/ai-testing.md).
# Costs real money (~$0.50 per run) — manual trigger only.
name: Coach safety eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: Gateway model id under test
        default: gemini-3.6-flash

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLMGATEWAY_API_KEY: ${{ secrets.LLMGATEWAY_API_KEY }}
      LLMGATEWAY_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:coach
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coach-eval-report
          path: eval-results/
